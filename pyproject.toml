[project]
name = "mlx-sdft"
version = "0.1.0"
description = "Self-Distillation Fine-Tuning (SDFT) for Apple Silicon — MLX implementation of Shenfeld et al. 2026"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Moreno Raimondo Vendra" }]
requires-python = ">=3.14"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: MacOS",
]
dependencies = [
    "mlx>=0.21",
    "mlx-lm>=0.18",
    "tqdm>=4.60",
    "huggingface-hub>=0.24",
    "numpy",
]

[project.optional-dependencies]
data = ["datasets>=2.18"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/szmoro/mlx-sdft"
Repository = "https://github.com/szmoro/mlx-sdft"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlx_sdft"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=mlx_sdft", "--cov-report=term-missing", "-v"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
